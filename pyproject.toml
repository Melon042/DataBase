[project]
name = "database"
version = "0.1.0"
description = "PostgreSQL database study project."
authors = [
    {name = "Dmitry"}
]
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "black (>=26.3.1,<27.0.0)",
    "flake8 (>=7.3.0,<8.0.0)",
    "isort (>=8.0.1,<9.0.0)",
    "psycopg2 (>=2.9.11,<3.0.0)",
    "requests (>=2.33.1,<3.0.0)",
    "env (>=0.1.0,<0.2.0)",
    "dotenv (>=0.9.9,<0.10.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
